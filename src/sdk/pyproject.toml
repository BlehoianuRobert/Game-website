[project]
name = "gridforge-sdk"
version = "0.1.0"
description = "Python SDK for the GridForge game platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gridforge"]
